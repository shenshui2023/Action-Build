          - oneplus_13s_w
          - oneplus_pad_2_pro
          - oneplus_pad_3
          - oneplus_ace5_ultra
          - oneplus_ace6
      钩：
        类型：选择
        描述：“钩子选择”
        必填：是
        默认值：手动
        选项：
          - kprobe
          -手动的
          -追踪点
      SUSFS_CI：
        类型：选择
        description : "下载SUSFS模块调用方式"
        必填：是
        默认值：否
        选项：
          - CI
          -发布
          - NoN
      KSU_META：
        类型：字符串
        描述: "路径名(必填)/自定义版本标识(留空不修改)/调整布局hash(留空不修改) "
        必填：否
        默认值：“ susfs-main/Numbersf/ ”
      构建时间：
        类型：字符串
        description : "自定义构建时间 (输入F使用当前时间) "
        必填：否
        默认值：“ 2025年8月18日星期一 09:30:24 UTC ”
      后缀：
        类型：字符串
        描述: “自定义内核后缀（不输入使用随机字符串）”
        必填：否
        默认：” ”
      快速构建：
        类型：布尔值
        description : "是否实现极速构建？"
        必填：是
        默认值：true
      LSM：
        类型：布尔值
        description : "是否更新内核分区阻止对关键分区/设备节点的更新分区(LSM)？"
        必填：是
        默认值：true
      日程安排：
        类型：布尔值
        description : "是否添加风驰驱动？"
        必填：是
        默认值：false
      ZRAM：
        类型：布尔值
        description : "是否添加更多ZRAM算法？"
        必填：是
        默认值：false

工作：
  建造：
    名称：${{ github.event.inputs.FAST_BUILD == 'true' && ' [FAST]' || '' }}${{ github.event.inputs.SCHED == 'true' && ' [SCHED]' || '' }}${{ github.event.inputs.ZRAM == 'true' && ' [ZRAM]' || '' }}${{ github.event.inputs.LSM == 'true' && ' [LSM]' || '' }}对于 ${{ github.event.inputs.FILE }} ${{ github.event.inputs.SUFFIX }}
    运行平台：ubuntu-latest
    环境：
      CCACHE_COMPILERCHECK : " %compiler% -dumpmachine; %compiler% -dumpversion "
      CCACHE_NOHASHDIR：" true "
      CCACHE_HARDLINK：" true "
      CCACHE_MAXSIZE：8G
    步骤：
      -名称：结账
        使用：actions/checkout@v4

      -名称：最大化构建空间
        使用：easimon/maximize-build-space@master
        和：
          root-reserve-mb：8192
          临时储备容量（mb）：2048
          remove-dotnet : ' true '
          remove-android : ' true '
          remove-haskell : ' true '
          remove-codeql : ' true '

      -名称：提取清单信息
        id：extract_info
        环境：
          文件：${{ github.event.inputs.FILE }}
        运行：|
          设置 -e
          cd "$GITHUB_WORKSPACE"
          如果 [[ "$FILE" =~ ^(.+)_([a-zA-Z])$ ]]; 则
            FILE_CONF="${BASH_REMATCH[1]}"
          别的
            FILE_CONF="$FILE"
          菲
          FILE_BASE=$(echo "$FILE_CONF" | sed -E 's/_([a-zA-Z0-9])/\U\1/g; s/^oneplus/OnePlus/; s/^realme/Realme/; s/^oppo/Oppo/')
          mkdir -p ".repo/manifests_fallback"
          XML_PATH=".repo/manifests_fallback/${FILE}.xml"
          README_PATH=".repo/manifests_fallback/README.md"
          echo "处理 FILE=$FILE, CONF=$FILE_CONF, BASE=$FILE_BASE"
          echo "FILE_CONF=$FILE_CONF" >> $GITHUB_ENV
          echo "FILE_BASE=$FILE_BASE" >> $GITHUB_ENV
          # 动态调用清单仓库，仓库优先级：1️⃣ OnePlusOSS → 2️⃣ 换 Numbersf(可)
          声明 -A REPOS
          REPOS["OnePlusOSS"]="https://api.github.com/repos/OnePlusOSS/kernel_manifest"
          REPOS["Dynamic"]="https://api.github.com/repos/Numbersf/kernel_manifest"
          FOUND_REPO=""
          找到分支=""
          check_repo() {
            本地所有者=$1
            本地 REPO_URL=$2
            echo "🌐尝试拉取${OWNER}分支列表..."
            BRANCHES=$(curl -s ${REPO_URL}/branches | jq -r '.[].name' || true)
            如果 [[ -z "$BRANCHES" ]]; 则
              echo "⚠️${OWNER}分支列表获取失败，跳过。"
              返回 1
            菲
            对于 $BRANCHES 中的每个 BRANCH；执行
              XML_URL="https://raw.githubusercontent.com/${OWNER}/kernel_manifest/$BRANCH/${FILE}.xml"
              README_URL="https://raw.githubusercontent.com/${OWNER}/kernel_manifest/$BRANCH/README.md"
              如果 curl -sf --head "$XML_URL" > /dev/null; 则
                echo "✅ 在 ${OWNER} 找到 ${FILE}.xml (分支: $BRANCH)"
                curl -s -o "$XML_PATH" "$XML_URL"
                curl -s -o "$README_PATH" "$README_URL" || true
                FOUND_REPO="$OWNER"
                找到分支="$BRANCH"
                返回 0
              菲
            完毕
            返回 1
          }
          # 默认仓库寻找文件
          如果 check_repo "OnePlusOSS" "${REPOS["OnePlusOSS"]}"; 则
            echo "MANIFEST_REPO=OnePlusOSS" >> $GITHUB_ENV
            echo "MANIFEST_BRANCH=$FOUND_BRANCH" >> $GITHUB_ENV
          菲
          #动态仓库寻找文件
          如果 [[ -z "$FOUND_REPO" ]]; 则
            DYNAMIC_URL="${REPOS["Dynamic"]}"
            DYNAMIC_OWNER=$(echo "$DYNAMIC_URL" | sed -E 's#https://api.github.com/repos/([^/]+)/.*#\1#')
            如果 check_repo "$DYNAMIC_OWNER" "$DYNAMIC_URL"; 则
              echo "MANIFEST_REPO=$DYNAMIC_OWNER" >> $GITHUB_ENV
              echo "MANIFEST_BRANCH=$FOUND_BRANCH" >> $GITHUB_ENV
            菲
          菲
          如果 [[ -z "$FOUND_REPO" || ! -s "$XML_PATH" ]]; 则
            echo "❌无法在动态仓库中找到${FILE}.xml"
            出口 1
          菲
          # 解析修订字符串
          REVISION=$(grep -oP '<project[^>]+revision="\K[^"]+' "$XML_PATH" | head -n1 || true)
          echo "解析文件获取CPU和ANDROID_VERSION..."
          # 取出CPU
          CPU=$(echo "$REVISION" | sed -E 's#^(oneplus|realme|oppo)/([^_]+).*#\2#')
          # 提取ANDROID_VERSION
          ANDROID_VERSION=$(echo "$REVISION" | grep -oP '\d{1,2}\.\d{1,2}(\.\d{1,2})?')
          如果 [[ -n "$CPU" && -n "$ANDROID_VERSION" ]]; 则
            echo "✅ CPU=$CPU, ANDROID_VERSION=$ANDROID_VERSION"
            echo "CPU=$CPU" >> $GITHUB_ENV
            echo "ANDROID_VERSION=$ANDROID_VERSION" >> $GITHUB_ENV
            # 获取短位Android版本号
            echo "ANDROID_SHORT_VERSION=${ANDROID_VERSION%%.*}" >> $GITHUB_ENV
          别的
            echo "❌无法从修订版中提取CPU或ANDROID_VERSION"
            出口 1
          菲
          echo "解析README.md获取CPUD和BUILD_METHOD..."
          如果 [[ -s "$README_PATH" ]]; 则
            BUILD_LINE=$(grep -m1 'oplus_build_kernel.sh' "$README_PATH" || true)
            如果 [[ -n "$BUILD_LINE" ]]; 则
              CPUD=$(echo "$BUILD_LINE" | awk '{print $(NF-1)}')
              BUILD_METHOD=$(echo "$BUILD_LINE" | awk '{print $NF}')
              echo "✅ CPUD=$CPUD, BUILD_METHOD=$BUILD_METHOD"
              echo "CPUD=$CPUD" >> $GITHUB_ENV
              echo "BUILD_METHOD=$BUILD_METHOD" >> $GITHUB_ENV
            别的
              echo "❌README.md 中未找到构建命令"
            菲
          别的
            echo "❌README.md 下载失败或为空"
          菲
          # 提交组合信息
          echo "value=${FILE_BASE}_Android${ANDROID_VERSION}" >> "$GITHUB_OUTPUT"
      -名称：调试 显示选定的输入
        运行：|
          echo "-----------------------"
          echo "已选择 CPU：${{ env.CPU }}"
          echo "已选择 CPUD：${{ env.CPUD }}"
          echo "已选择 ANDROID_VERSION: ${{ env.ANDROID_VERSION }}"
          echo "已选择 BUILD_METHOD: ${{ env.BUILD_METHOD }}"
          echo "已选择文件：${{ github.event.inputs.FILE }}"
          echo "自定义 KSU_META: ${{ github.event.inputs.KSU_META }}"
          echo "自定义 BUILD_TIME: ${{ github.event.inputs.BUILD_TIME }}"
          echo -n "BUILD_TIME Unicode: "
          python3 -c "p​​rint(''.join(f'U+{ord(c):04X} ' for c in '''${{ github.event.inputs.BUILD_TIME }}'''))"
          echo "自定义后缀：${{ github.event.inputs.SUFFIX }}"
          echo -n "SUFFIX Unicode: "
          python3 -c "p​​rint(''.join(f'U+{ord(c):04X} ' for c in '''${{ github.event.inputs.SUFFIX }}'''))"
          echo "已选择 SUSFS_CI: ${{ github.event.inputs.SUSFS_CI }}"
          echo "已选择 HOOK: ${{ github.event.inputs.HOOK }}"
          echo "已选择 LSM：${{ github.event.inputs.LSM }}"
          echo "已选择 FAST_BUILD: ${{ github.event.inputs.FAST_BUILD }}"
          echo "已选择 SCHED: ${{ github.event.inputs.SCHED }}"
          echo "已选择 ZRAM：${{ github.event.inputs.ZRAM }}"
          echo "-----------------------"
      -名称：检查磁盘空间
        运行：df -h

      -名称：创建并启用 3G 交换
        运行：|
          sudo swapoff -a
          sudo fallocate -l 3G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile
          释放 -h
      -名称：设置缓存环境
        运行：|
          echo "CCACHE_DIR=$HOME/.ccache_${{ github.event.inputs.FILE }}" >> $GITHUB_ENV
          mkdir -p "$HOME/.ccache_${{ github.event.inputs.FILE }}"
          echo "设置: $HOME/.ccache_${{ github.event.inputs.FILE }}"
      - name :配置 Git
        运行：|
          git config --global user.name "Numbersf"
          git config --global user.email "263623064@qq.com"
      -名称：安装依赖项 + APTC
        使用：awalsh128/cache-apt-pkgs-action@latest
        和：
          软件包：python3 git curl ccache libelf-dev build-essential flex bison libssl-dev libncurses-dev liblz4-tool zlib1g-dev libxml2-utils rsync unzip gawk dos2unix
          execute_install_scripts：true

      -名称：恢复 Ccache
        使用：actions/cache@v3
        和：
          路径：${{ env.CCACHE_DIR }}
          键：ccache-${{ runner.os }}-${{ github.ref_name }}-${{ github.event.inputs.FILE }}-${{ env.BUILD_METHOD }}-${{ github.event.inputs.FAST_BUILD == 'true' && 'alpha' || 'beta' }}-16

      -名称：初始化 Ccache
        运行：|
          INIT_FLAG="${{ env.CCACHE_DIR }}/.ccache_initialized"
          如果命令 -v ccache >/dev/null 2>&1; 则
            如果 [ ! -f "$INIT_FLAG" ]; 则
              echo "初始化ccache (${{ env.CCACHE_DIR }})..."
              mkdir -p "${{ env.CCACHE_DIR }}"
              ccache -M ${{ env.CCACHE_MAXSIZE }}
              触摸“$INIT_FLAG”
              echo "✅ ccache 初始化完成"
            别的
              echo "✅ ccache 已初始化，跳过"
            菲
          别的
            echo "❌未安装ccache，跳过"
          菲
          ccache -s
      -名称：安装存储库工具
        运行：|
          卷曲 https://storage.googleapis.com/git-repo-downloads/repo > ~/repo
          chmod a+x ~/repo
          sudo mv ~/repo /usr/local/bin/repo
      -名称：初始化存储库并同步
        环境：
          文件：${{ github.event.inputs.FILE }}
        运行：|
          mkdir kernel_workspace && cd kernel_workspace
          mkdir -p .repo/manifests
          cp "$GITHUB_WORKSPACE/.repo/manifests_fallback/${FILE}.xml" ".repo/manifests/${FILE}.xml"
          MANIFEST_REPO="${{ env.MANIFEST_REPO }}"
          MANIFEST_BRANCH="${{ env.MANIFEST_BRANCH }}"
          CPU="${{ env.CPU }}"
          echo "MANIFEST_REPO=$MANIFEST_REPO"
          echo "MANIFEST_BRANCH=$MANIFEST_BRANCH"
          BASE_URL="https://github.com/${MANIFEST_REPO}/kernel_manifest.git"
          echo "使用 $MANIFEST_REPO 的分支 $MANIFEST_BRANCH 初始化仓库..."
          repo init -u "$BASE_URL" -b "$MANIFEST_BRANCH" -m "${FILE}.xml" --repo-rev=v2.16 --depth=1 --no-clone-bundle --no-tags
          repo sync -c -j$(nproc) --no-clone-bundle --no-tags --force-sync
          对于 kernel_platform/common 和 kernel_platform/msm-kernel 中的每个目录；执行以下操作
            如果 [ -e "$dir/BUILD.bazel" ]; 则
              sed -i '/^[[:space:]]*"protected_exports_list"[[:space:]]*:[[:space:]]*"android\/abi_gki_protected_exports_aarch64",$/d' "$dir/BUILD.bazel"
            菲
            rm -f "$dir/android/abi_gki_protected_exports_"* 2>/dev/null || echo "$dir 中没有受保护的导出项"
          完毕
      -名称：内核版本处理
        运行：|
          cd kernel_workspace/kernel_platform
          # 获取Android版本号(KANDROID_VERSION)以及内核版本号(KERNEL_VERSION)
          for f in ./common/build.config.constants ./common/build.config.common; do
            如果 [ -f "$f" ]；则
              BRANCH=$(grep -m1 '^BRANCH=' "$f" | cut -d= -f2)
              [ -n "$BRANCH" ] && break
            菲
          完毕
          如果 [ -n "$BRANCH" ]；则
            echo "KANDROID_VERSION=${BRANCH%-*}" >> $GITHUB_ENV
            echo "KERNEL_VERSION=${BRANCH#*-}" >> $GITHUB_ENV
          别的
            echo "在 build.config 文件中未找到 BRANCH"
          菲
          # 从 Makefile 获取完整的内核版本号(TKERNEL_VERSION)以及可选的修改内核等级
          ORIG_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)
          # 强制修改SUBLEVEL(内核等级)，默认关闭
          # sed -i 's/^SUBLEVEL[[:space:]]*=[[:space:]]*.*/SUBLEVEL = 99/' ./common/Makefile
          # 读取修改后的版本
          NEW_VERSION=$(awk '/^VERSION =/ {v=$3} /^PATCHLEVEL =/ {p=$3} /^SUBLEVEL =/ {s=$3} END {print v"."p"."s}' ./common/Makefile)
          如果 [ "$ORIG_VERSION" != "$NEW_VERSION" ]; 则
            echo "内核版本:$ORIG_VERSION->$NEW_VERSION"
            echo "TKERNEL_VERSION=$NEW_VERSION" >> $GITHUB_ENV
          别的
            echo "内核版本：$ORIG_VERSION 无更改"
            echo "TKERNEL_VERSION=$ORIG_VERSION" >> $GITHUB_ENV
          菲
      #构建内核后缀
      - name :自定义内核后缀（如果已设置）
        如果：${{ github.event.inputs.SUFFIX != '' }}
        运行：|
          cd kernel_workspace
          SUFFIX="${{ github.event.inputs.SUFFIX }}"
          KANDROID_VERSION="${{ env.KANDROID_VERSION }}"
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"
          对于路径 \
            kernel_platform/common/scripts/setlocalversion \
            kernel_platform/msm-kernel/scripts/setlocalversion \
            kernel_platform/external/dtc/scripts/setlocalversion; 执行
            [ -f "$path" ] || 继续
            echo "正在修改：$path"
            # 删除 -dirty
            sed -i 's/ -dirty//g' "$path"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$path"
            如果 grep -q 'KERNELVERSION.*scm_version' "$path"; 则
              echo "检测到新的 setlocalversion 格式"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${SUFFIX}\"|" "$path"
            elif grep -q 'echo "\$res"' "$path"; then
              echo "检测到旧的 setlocalversion 格式"
              如果 [ "$FAST_BUILD" = "true" ]；则
                echo "FAST_BUILD 已启用：使用静态资源"
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${SUFFIX}\"/" "$path"
              别的
                echo "标准构建：通过 cut/echo 注入后缀"
                如果 [[ -f ./kernel_platform/build_with_bazel.py ]]; 则
                  echo "使用修改官方脚本编译且当使用 build_with_bazel 时，可能受特殊符号数量限制，编译失败请"
                  echo "使用官方脚本并通过 build_with_bazel 构建时，由于特殊字符数量限制，构建可能会失败。如果发生这种情况，请修改配置。"
                菲
                tac "$path" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${SUFFIX}; echo \"\\\$res\";/" | tac > "$path.tmp" && mv "$path.tmp" "$path"
              菲
            别的
              echo "未知格式，手动追加 echo"
              echo "echo \"\$res-${SUFFIX}\"" >> "$path"
            菲
            chmod +x "$path"
          完毕
          git add -A
          git commit -m "自定义后缀并移除 -dirty"
      # α官方格式的随机后缀（仅在SUFFIX未设置时生效）*
      - name :自定义内核随机后缀（如果为空）
        如果：${{ github.event.inputs.SUFFIX == '' }}
        运行：|
          cd kernel_workspace
          KANDROID_VERSION="${{ env.KANDROID_VERSION }}"
          FAST_BUILD="${{ github.event.inputs.FAST_BUILD }}"
          # 生成随机数字和随机hash
          RANDOM_DIGIT=$(od -An -N1 -tu1 < /dev/urandom | tr -d '[:space:]' | awk '{print $1 % 11}')
          RANDOM_HASH=$(od -An -N7 -tx1 /dev/urandom | tr -d ' \n')
          RANDOM_SUFFIX="${RANDOM_DIGIT}-og${RANDOM_HASH}"
          对于路径 \
            kernel_platform/common/scripts/setlocalversion \
            kernel_platform/msm-kernel/scripts/setlocalversion \
            kernel_platform/external/dtc/scripts/setlocalversion; 执行
            [ -f "$path" ] || 继续
            echo "正在修改：$path"
            # 删除 -dirty
            sed -i 's/ -dirty//g' "$path"
            sed -i '$i res=$(echo "$res" | sed '\''s/-dirty//g'\'')' "$path"
            如果 grep -q 'KERNELVERSION.*scm_version' "$path"; 则
              echo "检测到新的 setlocalversion 格式"
              sed -i "s|echo \"\${KERNELVERSION}.*scm_version}\"|echo \"\${KERNELVERSION}-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"|" "$path"
            elif grep -q 'echo "\$res"' "$path"; then
              echo "检测到旧的 setlocalversion 格式"
              如果 [ "$FAST_BUILD" = "true" ]；则
                echo "FAST_BUILD 已启用：使用带有随机后缀的静态资源"
                sed -i "s/^res=.*/res=\"-${KANDROID_VERSION}-${RANDOM_SUFFIX}\"/" "$path"
              别的
                echo "标准构建：通过 cut/echo 注入随机后缀"
                tac "$path" | sed "0,/echo \"\\\$res\"/s//res=\\\$(echo \\\$res | cut -d- -f1-2)-${RANDOM_SUFFIX}; echo \"\\\$res\";/" | tac > "$path.tmp" && mv "$path.tmp" "$path"
              菲
            别的
              echo "未知格式，手动追加 echo"
              echo "echo \"\$res-${RANDOM_SUFFIX}\"" >> "$path"
            菲
            chmod +x "$path"
          完毕
          git add -A
          git commit -m "随机后缀并移除 -dirty"
      -名称：添加 SukiSU Ultra
        运行：|
          cd kernel_workspace/kernel_platform
          META="${{ github.event.inputs.KSU_META }}"
          # 必须包含两个分隔符（至少三个字段）
          如果 [[ "$(grep -o '/' <<< "$META" | wc -l)" -lt 2 ]]; 则
            echo "错误: KSU_META 参数缺少的分隔符 '/'，格式应为: 路径名/自定义标签(可简洁)/提交hash(可简洁)"
            10号出口
          菲
          # 解析字段：分支 / 自定义标识 / 手动哈希
          IFS='/' 读取 -r BRANCH_NAME CUSTOM_TAG MANUAL_HASH <<< "$META"
          echo "路径名称: $BRANCH_NAME"
          [[ -n "$CUSTOM_TAG" ]] && echo "自定义版本标识: $CUSTOM_TAG" || echo "自定义版本标识: 未启用"
          [[ -n "$MANUAL_HASH" ]] && echo "手动指定哈希：$MANUAL_HASH" || echo "手动指定哈希: 未启用"
          curl -LSs "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/main/kernel/setup.sh" | bash -s "$BRANCH_NAME"
          cd ./KernelSU
          # 如果指定了手动hash，就切换到该提交
          如果 [[ -n "$MANUAL_HASH" ]]; 则
            git fetch origin "$BRANCH_NAME" --depth=50
            git checkout "$MANUAL_HASH"
            SHORT_HASH=${MANUAL_HASH:0:8}
          菲
          KSU_API_VERSION=$(curl -fsSL "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU-Ultra/$BRANCH_NAME/kernel/Makefile" | \
